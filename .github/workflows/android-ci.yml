name: Android CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "agent/**"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-build:
    name: Native Android builds
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            build.gradle
            settings.gradle
            gradle.properties
            apps/01-openxr-bootstrap/build.gradle
            apps/02-vulkan-stereo-triangle/build.gradle
            apps/03-head-pose/build.gradle
            apps/04-controller-input/build.gradle
            apps/05-passthrough/build.gradle
            apps/06-spatial-object/build.gradle
            apps/07-hand-tracking/build.gradle
            apps/08-spatial-anchors/build.gradle
            apps/09-quest-camera/build.gradle
            apps/10-rfdetr-detection/build.gradle
            XrPassthrough/Projects/Android/build.gradle
            XrPassthrough/Projects/Android/gradle/wrapper/gradle-wrapper.properties

      - name: Select canonical toolchain roots
        run: |
          echo "QUEST_ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "QUEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle runtime Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Gradle runtime
        run: echo "QUEST_GRADLE_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Check shell scripts
        run: |
          shellcheck -x \
            scripts/setup_quest_dev_env.sh \
            scripts/print_toolchain_config.sh \
            scripts/build_deploy.sh \
            scripts/capture_performance_bundle.sh \
            scripts/xr_operator_session.sh \
            scripts/toolchain_config.sh \
            tools/rfdetr_inference/prepare_onnxruntime.sh \
            tools/rfdetr_inference/prepare_onnxruntime_android.sh \
            tools/xr_operator/build_probe_layer.sh \
            tools/xr_operator/prepare_xr_operator.sh

      - name: Install pinned Android toolchain
        run: |
          source scripts/toolchain_config.sh
          quest_export_toolchain
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-$QUEST_COMPILE_SDK" \
            "build-tools;$QUEST_BUILD_TOOLS_VERSION" \
            "cmake;$QUEST_CMAKE_VERSION" \
            "ndk;$QUEST_NDK_VERSION"

      - name: Verify pinned toolchain
        run: ./scripts/print_toolchain_config.sh --strict

      - name: Test XR math
        run: |
          cmake -S libs/xr_math -B build/xr-math-tests -DBUILD_TESTING=ON
          cmake --build build/xr-math-tests --parallel
          ctest --test-dir build/xr-math-tests --output-on-failure

      - name: Test bounded performance telemetry
        run: |
          cmake -S libs/perf_telemetry -B build/perf-telemetry-tests -DBUILD_TESTING=ON
          cmake --build build/perf-telemetry-tests --parallel
          ctest --test-dir build/perf-telemetry-tests --output-on-failure

      - name: Test performance telemetry with host sanitizers
        run: |
          cmake \
            -S libs/perf_telemetry \
            -B build/perf-telemetry-sanitized \
            -DBUILD_TESTING=ON \
            -DQUESTLAB_ENABLE_SANITIZERS=ON
          cmake --build build/perf-telemetry-sanitized --parallel
          ctest \
            --test-dir build/perf-telemetry-sanitized \
            --output-on-failure

      - name: Test XR interaction
        run: |
          cmake -S libs/xr_interaction -B build/xr-interaction-tests -DBUILD_TESTING=ON
          cmake --build build/xr-interaction-tests --parallel
          ctest --test-dir build/xr-interaction-tests --output-on-failure

      - name: Test XR event fan-out
        run: |
          cmake -S libs/xr_core/tests -B build/xr-core-tests
          cmake --build build/xr-core-tests --parallel
          ctest --test-dir build/xr-core-tests --output-on-failure

      - name: Test spatial-anchor records
        run: |
          cmake -S libs/xr_spatial_anchors/tests -B build/xr-spatial-anchor-tests
          cmake --build build/xr-spatial-anchor-tests --parallel
          ctest --test-dir build/xr-spatial-anchor-tests --output-on-failure

      - name: Test camera-source ownership and conversion
        run: |
          cmake -S libs/camera_source -B build/camera-source-tests -DBUILD_TESTING=ON
          cmake --build build/camera-source-tests --parallel
          ctest --test-dir build/camera-source-tests --output-on-failure

      - name: Test weight-free RF-DETR contract
        run: |
          cmake \
            -S tools/rfdetr_inference \
            -B build/rfdetr-inference-tests \
            -DBUILD_TESTING=ON \
            -DQUESTLAB_ENABLE_ONNXRUNTIME=OFF
          cmake --build build/rfdetr-inference-tests --parallel
          ctest \
            --test-dir build/rfdetr-inference-tests \
            --output-on-failure

      - name: Test detection projection geometry
        run: |
          cmake \
            -S libs/detection_projection \
            -B build/detection-projection-tests \
            -DBUILD_TESTING=ON
          cmake --build build/detection-projection-tests --parallel
          ctest \
            --test-dir build/detection-projection-tests \
            --output-on-failure

      - name: Test object-detector boundary and replay
        run: |
          cmake \
            -S libs/object_detector \
            -B build/object-detector-tests \
            -DBUILD_TESTING=ON \
            -DQUESTLAB_ENABLE_ONNXRUNTIME=OFF
          cmake --build build/object-detector-tests --parallel
          ctest \
            --test-dir build/object-detector-tests \
            --output-on-failure

      - name: Build OpenXR bootstrap
        run: ./scripts/build_deploy.sh --app 01-openxr-bootstrap --build-only

      - name: Build Vulkan stereo triangle
        run: ./scripts/build_deploy.sh --app 02-vulkan-stereo-triangle --build-only

      - name: Build head pose and coordinate spaces
        run: ./scripts/build_deploy.sh --app 03-head-pose --build-only

      - name: Build controller input and interaction
        run: ./scripts/build_deploy.sh --app 04-controller-input --build-only

      - name: Build passthrough mixed reality
        run: ./scripts/build_deploy.sh --app 05-passthrough --build-only

      - name: Build stable spatial object
        run: ./scripts/build_deploy.sh --app 06-spatial-object --build-only

      - name: Build hand tracking and pinch interaction
        run: ./scripts/build_deploy.sh --app 07-hand-tracking --build-only

      - name: Build persistent spatial anchors
        run: ./scripts/build_deploy.sh --app 08-spatial-anchors --build-only

      - name: Build Quest camera capture
        run: ./scripts/build_deploy.sh --app 09-quest-camera --build-only

      - name: Build on-device RF-DETR detection
        run: ./scripts/build_deploy.sh --app 10-rfdetr-detection --build-only

      - name: Build XR Operator packaging probe
        run: |
          ./tools/xr_operator/build_probe_layer.sh
          ORG_GRADLE_PROJECT_questXrOperatorRoot=build/dependencies/questlab-probe-layer \
            ./scripts/build_deploy.sh \
              --app 01-openxr-bootstrap \
              --variant operator \
              --build-only

      - name: Verify XR Operator APK isolation
        run: |
          apk=apps/01-openxr-bootstrap/build/outputs/apk/operator/01-openxr-bootstrap-operator.apk
          manifest=apps/01-openxr-bootstrap/build/intermediates/packaged_manifests/operator/AndroidManifest.xml
          listing="$RUNNER_TEMP/operator-apk-files.txt"
          unzip -Z1 "$apk" > "$listing"
          grep -Fxq 'lib/arm64-v8a/libopenxr_probe_layer.so' "$listing"
          grep -Fxq \
            'assets/openxr/1/api_layers/implicit.d/questlab_probe_layer.json' \
            "$listing"
          grep -q 'android:extractNativeLibs="true"' "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"

      - name: Verify XR Operator privacy allow-list
        run: |
          for app in 05-passthrough 09-quest-camera 10-rfdetr-detection; do
            set +e
            ./scripts/build_deploy.sh \
              --app "$app" \
              --variant operator \
              --build-only
            status=$?
            set -e
            if [[ "$status" -ne 2 ]]; then
              echo "Expected Operator rejection for $app; got $status." >&2
              exit 1
            fi
          done

      - name: Build legacy passthrough regression
        run: ./scripts/build_deploy.sh --app xrpassthrough --build-only

      - name: Build release-equivalent benchmark matrix
        run: |
          for app in \
            01-openxr-bootstrap \
            02-vulkan-stereo-triangle \
            03-head-pose \
            04-controller-input \
            05-passthrough \
            06-spatial-object \
            07-hand-tracking \
            08-spatial-anchors \
            09-quest-camera \
            10-rfdetr-detection \
            xrpassthrough; do
              ./scripts/build_deploy.sh \
                --app "$app" \
                --variant benchmark \
                --build-only
          done

      - name: Verify INTERNET permission isolation
        run: |
          for variant in debug benchmark; do
            for app in \
              01-openxr-bootstrap \
              02-vulkan-stereo-triangle \
              03-head-pose \
              04-controller-input \
              05-passthrough \
              06-spatial-object \
              07-hand-tracking \
              08-spatial-anchors \
              09-quest-camera; do
                manifest="apps/$app/build/intermediates/packaged_manifests/$variant/AndroidManifest.xml"
                if grep -q 'android.permission.INTERNET' "$manifest"; then
                  echo "Unexpected INTERNET permission: $manifest" >&2
                  exit 1
                fi
            done
            manifest="apps/10-rfdetr-detection/build/intermediates/packaged_manifests/$variant/AndroidManifest.xml"
            grep -q 'android.permission.INTERNET' "$manifest"
          done

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apks
          path: |
            apps/01-openxr-bootstrap/build/outputs/apk/debug/01-openxr-bootstrap-debug.apk
            apps/02-vulkan-stereo-triangle/build/outputs/apk/debug/02-vulkan-stereo-triangle-debug.apk
            apps/03-head-pose/build/outputs/apk/debug/03-head-pose-debug.apk
            apps/04-controller-input/build/outputs/apk/debug/04-controller-input-debug.apk
            apps/05-passthrough/build/outputs/apk/debug/05-passthrough-debug.apk
            apps/06-spatial-object/build/outputs/apk/debug/06-spatial-object-debug.apk
            apps/07-hand-tracking/build/outputs/apk/debug/07-hand-tracking-debug.apk
            apps/08-spatial-anchors/build/outputs/apk/debug/08-spatial-anchors-debug.apk
            apps/09-quest-camera/build/outputs/apk/debug/09-quest-camera-debug.apk
            apps/10-rfdetr-detection/build/outputs/apk/debug/10-rfdetr-detection-debug.apk
            XrPassthrough/Projects/Android/build/outputs/apk/debug/XrPassthrough-debug.apk
            apps/01-openxr-bootstrap/build/outputs/apk/benchmark/01-openxr-bootstrap-benchmark.apk
            apps/02-vulkan-stereo-triangle/build/outputs/apk/benchmark/02-vulkan-stereo-triangle-benchmark.apk
            apps/03-head-pose/build/outputs/apk/benchmark/03-head-pose-benchmark.apk
            apps/04-controller-input/build/outputs/apk/benchmark/04-controller-input-benchmark.apk
            apps/05-passthrough/build/outputs/apk/benchmark/05-passthrough-benchmark.apk
            apps/06-spatial-object/build/outputs/apk/benchmark/06-spatial-object-benchmark.apk
            apps/07-hand-tracking/build/outputs/apk/benchmark/07-hand-tracking-benchmark.apk
            apps/08-spatial-anchors/build/outputs/apk/benchmark/08-spatial-anchors-benchmark.apk
            apps/09-quest-camera/build/outputs/apk/benchmark/09-quest-camera-benchmark.apk
            apps/10-rfdetr-detection/build/outputs/apk/benchmark/10-rfdetr-detection-benchmark.apk
            XrPassthrough/Projects/Android/build/outputs/apk/benchmark/XrPassthrough-benchmark.apk
          if-no-files-found: error
          retention-days: 14
