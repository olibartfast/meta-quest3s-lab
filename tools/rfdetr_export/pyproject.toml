[project]
name = "questlab-rfdetr-export"
version = "0.1.0"
description = "Pinned RF-DETR Nano export and Quest fixture reference tooling"
requires-python = "==3.11.*"
dependencies = [
    "numpy==2.3.5",
    "onnx==1.20.1",
    "onnxruntime==1.21.0",
    "rfdetr[onnx]==1.9.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
